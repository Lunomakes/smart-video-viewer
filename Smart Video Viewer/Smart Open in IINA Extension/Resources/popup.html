<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>视频观影</title><link rel="stylesheet" href="popup.css"><script src="tab-actions.js" defer></script><script src="popup.js" defer></script></head>
<body><header><h1>视频观影</h1></header>
<main><label for="videos">当前网页的视频</label><select id="videos" disabled><option>正在检测…</option></select>
<button id="viewer" class="primary" disabled>进入独立观影</button><button id="exit" hidden>退出独立观影</button>
<div class="preferences"><label for="rate">默认倍速 <span>0.1–16×</span></label><input id="rate" type="number" min="0.1" max="16" step="0.1" value="1"><label for="seek">每次快进／快退 <span>秒</span></label><input id="seek" type="number" min="0.1" max="600" step="any" value="5"></div>
<p class="hint">← → 按设定秒数跳转 · 空格暂停<br>观影时可拖动滑块连续调节倍速。</p><div class="footer"><button id="iina">在 IINA 中打开 ↗</button><button id="refresh">重新检测</button></div><p id="status" role="status" aria-live="polite">正在连接网页…</p></main></body></html>
