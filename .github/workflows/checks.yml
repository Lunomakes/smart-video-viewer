name: Checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Validate source and packaged resources
        run: node scripts/check.mjs
      - name: Check tracked files for privacy leaks
        run: |
          node scripts/privacy-check.mjs
          node scripts/privacy-check.mjs --history HEAD
      - name: Run background and subtitle regression tests
        run: node --test "Smart Video Viewer/tests/"*.test.mjs
